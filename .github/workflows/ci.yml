name: CI
on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (site-src, scripts)
        run: npm run lint
      - name: Public Goten at the commit in goten.ref (app sentences, labels, release notes)
        run: npm run goten:fetch
      - name: Public Trunks at the commit in trunks.ref (release notes, UI text, default categories)
        run: npm run trunks:fetch
      - name: Public product docs at the docs pin in site-src/docs.json (the docs pages are re-rendered and compared)
        run: npm run docs:fetch
      - name: Website checks (CSP markup, links, docs pages against the docs pin, app sentences, P9 figures, demo package hashes, script build and size, source-backed illustrations)
        run: npm run site:check
      - name: Illustration source guard hostile copies
        if: hashFiles('scripts/check-illustrations.test.mjs') != ''
        run: node --test scripts/check-illustrations.test.mjs
