name: Toolkit and Inbox drift
# Weekly (and on demand): run the website checks against the public Toolkit's and Inbox's latest main, not the pinned
# toolkit.ref / inbox.ref. Fails when a release changed a sentence, label or figure the site quotes: then update the page and
# the ref (for the Inbox also the demo package, scripts/inbox-demo.mjs).
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Public Toolkit at its latest main
        run: npm run toolkit:fetch
        env:
          TOOLKIT_REF: main
      - name: Public Inbox at its latest main
        run: npm run inbox:fetch
        env:
          INBOX_REF: main
      - name: Public product docs at the docs pin in site-src/docs.json (the docs pages are re-rendered and compared)
        run: npm run docs:fetch
      - name: Website checks against them
        run: npm run site:check
        env:
          TOOLKIT_DIR: vendor/toolkit
          INBOX_DIR: vendor/inbox
